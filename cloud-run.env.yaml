# Non-secret runtime configuration for the public Agent Ledger demo.
# Author: Miguel Medina Cantos

GOOGLE_CLOUD_PROJECT: "<YOUR_PROJECT_ID>"
GOOGLE_CLOUD_LOCATION: "global"
GOOGLE_GENAI_USE_VERTEXAI: "true"
GEMINI_MODEL: "gemini-3.5-flash"
GEMINI_BATCH_ENABLED: "false"
INSERT_INTO_INDEX: "false"

FIRESTORE_DATABASE: "agent-test1-100"
FIRESTORE_COLLECTION: "invoices"
FIRESTORE_VECTOR_FIELD: "embedding"
VECTOR_DISTANCE_MEASURE: "DOT_PRODUCT"

EMBEDDING_MODEL: "paraphrase-multilingual-MiniLM-L12-v2"
EMBEDDING_DIMENSION: "384"
EMBEDDING_BATCH_SIZE: "16"
EMBEDDING_DEVICE: "cpu"
NORMALIZE_EMBEDDINGS: "true"

CHAT_MAX_OUTPUT_TOKENS: "8000"
CHAT_TEMPERATURE: "0.2"
CHAT_TOP_P: "0.9"
CHAT_SEARCH_LIMIT: "10"
CHAT_LIST_LIMIT: "200"
LOG_LEVEL: "INFO"
